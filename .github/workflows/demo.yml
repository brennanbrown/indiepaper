name: Deploy Demo Site

on:
  push:
    branches: [ main ]
    paths: [ 'indiepaper-demo/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'indiepaper-demo/**' ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./indiepaper-demo
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.148.2'
        extended: true
    
    - name: Build with Hugo
      run: hugo --gc --minify
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./indiepaper-demo/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
