baseURL = 'https://indiepaper.netlify.app/'
languageCode = 'en-us'
title = 'Indiepaper'
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/brennanbrown/indiepaper"

[params]
  description = "A brutalist, smolweb-compliant, accessibility-first, indieweb-native Hugo theme"
  motto = "Write. Publish. Own your content."
  mainSections = ["post"]
  
  [params.author]
    name = "Brennan Brown"
    email = "contact@example.com"
    url = "https://indiepaper.netlify.app"
    bio = "Writer, developer, and advocate for the small web."
    photo = "/author-photo.svg"
  
  [params.location]
    region = "CA-AB"
    placename = "Grande Prairie, Alberta"
  
  [params.support]
    url = "https://ko-fi.com/brennanbrown"
    text = "Buy me a coffee"
  
  [params.indieweb]
    token_endpoint = "https://tokens.indieauth.com/token"
    authorization_endpoint = "https://indieauth.com/auth"
    micropub_endpoint = "https://indiepaper.netlify.app/micropub"
    microsub_endpoint = "https://aperture.p3k.io/microsub/123"
    webmention_endpoint = "https://webmention.io/indiepaper.netlify.app/webmention"
    webmention_api = "https://webmention.io/api/mentions.jf2"
  
  [[params.social]]
    name = "Mastodon"
    url = "https://mastodon.social/@username"
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/username"
  [[params.social]]
    name = "Bluesky"
    url = "https://bsky.app/profile/username"

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  post = "/:slug"
  notes = "/notes/:slug"

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.RSS]
    mediatype = "application/rss+xml"
    baseName = "feed"
  [outputFormats.JSON]
    mediatype = "application/json"
    baseName = "feed"
